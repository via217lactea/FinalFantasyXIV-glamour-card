name: Refresh game data

# Keeps the item and dye catalogue current with the upstream datamining
# repositories, and nothing else.
#
# Icons are deliberately out of scope. They are extracted from an installed
# game client, which a runner does not have, and build:sprites rebuilds every
# sheet from icons/ — so running it here would repack the sheets from an empty
# folder and wipe all of them. That work stays local; see DEPLOY.md.

on:
  schedule:
    - cron: '0 18 * * 1' # Monday 03:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Plain install: esbuild and sharp both ship platform binaries as optional
      # dependencies, and omitting those breaks tsx before anything can run.
      - name: Install
        run: npm ci

      - name: Rebuild the catalogue
        run: npm run build:data

      - name: Record patch versions
        run: npm run build:versions
        continue-on-error: true

      # With no icons/ on the runner this compares against the committed sprite
      # sheets, so the number means "what the deployed site is missing". It
      # writes a list rather than fetching anything.
      - name: Note any icons the sprites are missing
        run: npm run check:icons
        continue-on-error: true

      - name: Open a PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(data): refresh catalogue'
          branch: data/refresh
          title: 'chore(data): refresh catalogue'
          body: |
            Regenerated from the upstream datamining repositories.

            Icons are not touched here — they come from a local game client.
            If `public/data/missing-icons.json` grew, run the icon steps in
            DEPLOY.md locally and push the new sprites.
          add-paths: public/data
